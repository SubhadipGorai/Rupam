<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rupam Singha | Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #4f46e5);
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 45px 30px 35px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: white;
        }

        .photo {
            width: 175px;
            height: 175px;
            object-fit: cover;
            object-position: center top;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 22px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .department {
            font-size: 16px;
            color: #dbeafe;
            margin-bottom: 25px;
        }

        .instagram {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            background: white;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
            transition: 0.25s ease;
        }

        .instagram:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            background: #f8fafc;
        }

        .handle {
            margin-top: 14px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #cbd5e1;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .card {
                padding: 38px 22px 30px;
            }

            .photo {
                width: 150px;
                height: 150px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="card">
        <img class="photo" src="Profile.jpeg" alt="Photo of Rupam Singha">

        <h1>Rupam Singha</h1>

        <p class="department">Civil Engineering - 4th Year</p>

        <a class="instagram"
           href="https://www.instagram.com/rup_awm_ig_10/"
           target="_blank"
           rel="noopener noreferrer">
            📷 &nbsp; @rup_awm_ig_10
        </a>

        <p class="handle">Follow me on Instagram</p>

        <p class="footer">Welcome to my personal webpage</p>
    </main>

</body>
</html>
